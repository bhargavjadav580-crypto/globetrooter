services:
  - type: web
    name: trip-planner
    env: python
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 18.20.0
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: trip_planner
      - key: ENVIRONMENT
        value: production
